<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juan's Training">
<link rel="manifest" href="manifest.json">
<title>Juan's Training</title>
<style>
:root{--bg:#080d13;--panel:#111a24;--card:#172331;--text:#f4f7fb;--muted:#91a0b2;--blue:#2f8cff;--green:#25c77a;--red:#ff5252;--purple:#a96cff;--orange:#ff9f43;--cyan:#34c8ff;--border:#263544}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;overscroll-behavior:none;touch-action:manipulation}
body{-webkit-text-size-adjust:100%;user-select:none}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:92px}
.top{padding:calc(18px + env(safe-area-inset-top)) 18px 10px;display:flex;justify-content:space-between;align-items:center}
.title{font-size:25px;font-weight:800} .subtitle{font-size:13px;color:var(--muted);margin-top:3px}
.iconbtn,.arrow{border:1px solid var(--border);background:var(--panel);border-radius:14px}
.iconbtn{width:44px;height:44px;font-size:22px} .monthbar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px}
.month{font-size:20px;font-weight:800} .arrow{width:44px;height:44px;font-size:25px}
.calendar{margin:0 12px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--muted);font-size:11px;margin-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{min-height:68px;background:#0d151e;border:1px solid #1c2a38;border-radius:12px;padding:7px;text-align:left;position:relative}
.day.muted{opacity:.28} .day.selected{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.num{font-size:13px;font-weight:700} .dotrow{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block} .run{background:var(--green)} .lift{background:var(--red)} .swim{background:var(--cyan)} .bike{background:var(--orange)} .other{background:var(--purple)}
.details,.card{background:var(--panel);border:1px solid var(--border);border-radius:20px}
.details{margin:14px 12px;padding:16px} .datehead{font-size:17px;font-weight:800} .hint{font-size:12px;color:var(--muted);margin-top:3px}
.workout{margin-top:10px;border:1px solid var(--border);background:var(--card);border-radius:15px;padding:14px;width:100%;text-align:left}
.wtop{display:flex;align-items:center;gap:10px} .wname{font-weight:750} .winfo{font-size:13px;color:var(--muted);margin-top:4px}
.section{padding:0 12px;margin-top:16px} .card{padding:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px} .stat{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:13px} .stat b{font-size:20px}
.check{display:flex;gap:10px;align-items:center;margin-top:11px;color:#dbe4ee;font-size:14px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(8,13,19,.97);border-top:1px solid var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav{max-width:560px;margin:auto;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .nav button{background:transparent;border:0;padding:8px 4px;color:var(--muted);font-size:12px} .nav button.active{color:var(--blue);font-weight:700}
.screen{display:none} .screen.active{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:10} .modal.show{display:flex}
.sheet{background:#111a24;border-radius:24px 24px 0 0;width:100%;max-height:88vh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.sheet h2{margin:0 0 8px} .primary{background:var(--blue);border:0;border-radius:14px;padding:13px 16px;width:100%;font-weight:750}
.small{font-size:12px;color:var(--muted);line-height:1.55} .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--card);margin:3px 3px 0 0;font-size:11px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center} .divider{height:1px;background:var(--border);margin:14px 0}
@media (max-width:370px){.day{min-height:60px;padding:6px}.grid{gap:4px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div><div class="title">Juan's Training</div><div class="subtitle">Train · Improve · Race · Repeat</div></div>
  <button class="iconbtn" id="settings" aria-label="Settings">⚙︎</button>
</header>

<section id="calendarScreen" class="screen active">
  <div class="monthbar"><button class="arrow" id="prev">‹</button><div class="month" id="month"></div><button class="arrow" id="next">›</button></div>
  <div class="calendar">
    <div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="details" id="details"></div>
</section>

<section id="progressScreen" class="screen">
  <div class="section"><div class="card">
    <div style="font-size:20px;font-weight:800">Weekly Progress</div>
    <div class="hint" id="weekLabel"></div>
    <div class="stats">
      <div class="stat"><b id="runMiles">0.0</b><div class="hint">Run miles</div></div>
      <div class="stat"><b id="bikeTime">0m</b><div class="hint">Bike time</div></div>
      <div class="stat"><b id="liftSessions">0</b><div class="hint">Lift sessions</div></div>
      <div class="stat"><b id="swimSessions">0</b><div class="hint">Swim sessions</div></div>
    </div>
    <div class="divider"></div>
    <div class="row"><span>Total planned time</span><b id="trainingHours">0.0h</b></div>
  </div></div>
  <div class="section"><div class="card">
    <b>Goals</b>
    <div class="check">🏊 <span>70.3 Chattanooga</span></div>
    <div class="check">🏃 <span>Fayetteville Half Marathon · Dec 5</span></div>
    <div class="check">🏋️ <span>Bench 315</span></div>
  </div></div>
</section>

<section id="workoutsScreen" class="screen">
  <div class="section"><div class="card">
    <div style="font-size:20px;font-weight:800">Training Plan</div>
    <div class="hint">Runs, bikes, swims and lifts</div>
    <div id="workoutList"></div>
  </div></div>
</section>

<div class="bottom"><nav class="nav">
  <button data-screen="calendarScreen" class="active">▣<br>Calendar</button>
  <button data-screen="workoutsScreen">♜<br>Workouts</button>
  <button data-screen="progressScreen">▥<br>Progress</button>
</nav></div>
</div>

<div class="modal" id="modal"><div class="sheet">
  <h2 id="modalTitle"></h2><div id="modalBody" class="small"></div><br>
  <button class="primary" id="close">Done</button>
</div></div>

let view = new Date(2026,8,23), selected = "2026-09-23";
const pad=n=>String(n).padStart(2,"0");
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;

function render(){
  const y=view.getFullYear(),m=view.getMonth();
  document.getElementById("month").textContent=view.toLocaleString("en-US",{month:"long",year:"numeric"});
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),g=document.getElementById("grid");
  g.innerHTML="";
  for(let i=0;i<42;i++){
    let d=i-first+1,yy=y,mm=m,muted=false;
    if(d<1){d=prevDays+d;mm--;muted=true;if(mm<0){mm=11;yy--}}
    else if(d>days){d-=days;mm++;muted=true;if(mm>11){mm=0;yy++}}
    let k=key(yy,mm,d),b=document.createElement("button");
    b.className="day"+(muted?" muted":"")+(k===selected?" selected":""); b.type="button";
    b.innerHTML=`<div class="num">${d}</div><div class="dotrow">${(workouts[k]||[]).map(w=>`<i class="dot ${w.type}"></i>`).join("")}</div>`;
    b.onclick=()=>{selected=k;render();showDetails()};
    g.appendChild(b);
  }
  showDetails(); updateProgress();
}

function showDetails(){
  const p=selected.split("-").map(Number),d=new Date(p[0],p[1]-1,p[2]),items=workouts[selected]||[];
  document.getElementById("details").innerHTML=`<div class="datehead">${d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
  <div class="hint">${items.length?items.length+" session"+(items.length>1?"s":"")+" planned":"Recovery / no workout scheduled"}</div>`+
  (items.length?items.map((w,i)=>`<button class="workout" type="button" data-i="${i}">
    <div class="wtop"><i class="dot ${w.type}" style="width:10px;height:10px"></i><div><div class="wname">${w.name}</div><div class="winfo">${w.info}</div></div><span style="margin-left:auto">›</span></div>
  </button>`).join(""):`<div class="small" style="margin-top:14px">No workout is scheduled for this day.</div>`);
  document.querySelectorAll(".workout").forEach(b=>b.onclick=()=>openWorkout(items[+b.dataset.i]));
}

function openWorkout(w){
  let extra="";
  if(w.type==="run") extra=`<div class="pill">${w.miles} mi</div><div class="pill">9:00/mi</div><div class="pill">${w.minutes} min</div>`;
  if(w.type==="bike") extra=`<div class="pill">${w.minutes||"Optional"} min</div><div class="pill">Miles tracked after ride</div>`;
  if(w.type==="swim") extra=`<div class="pill">30 min</div>`;
  if(w.type==="lift") extra=`<div class="pill">1 hour</div>`;
  document.getElementById("modalTitle").textContent=w.name;
  document.getElementById("modalBody").innerHTML=`${extra}<div class="divider"></div>${w.notes||"Planned training session."}`;
  document.getElementById("modal").classList.add("show");
}
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("show")};

document.getElementById("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
document.getElementById("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(b.dataset.screen).classList.add("active");
  if(b.dataset.screen==="workoutsScreen") renderWorkoutList();
  if(b.dataset.screen==="progressScreen") updateProgress();
});

function weekRange(d){
  const x=new Date(d), day=x.getDay(), diff=day===0?-6:1-day;
  const start=new Date(x); start.setDate(x.getDate()+diff);
  const end=new Date(start); end.setDate(start.getDate()+6);
  return [start,end];
}
function inRange(k,start,end){
  const d=new Date(k+"T00:00:00"); return d>=start && d<=end;
}
function updateProgress(){
  const [start,end]=weekRange(new Date(selected+"T00:00:00"));
  let rm=0,bm=0,ls=0,ss=0,total=0;
  Object.entries(workouts).forEach(([k,arr])=>{
    if(!inRange(k,start,end)) return;
    arr.forEach(w=>{if(w.type==="run"){rm+=w.miles||0;total+=w.minutes||0} if(w.type==="bike"){bm+=w.minutes||0;total+=w.minutes||0} if(w.type==="lift"){ls++;total+=w.minutes||0} if(w.type==="swim"){ss++;total+=w.minutes||0}});
  });
  document.getElementById("runMiles").textContent=rm.toFixed(1);
  document.getElementById("bikeTime").textContent=bm>=60?`${Math.floor(bm/60)}h ${Math.round(bm%60)}m`:`${Math.round(bm)}m`;
  document.getElementById("liftSessions").textContent=ls;
  document.getElementById("swimSessions").textContent=ss;
  document.getElementById("trainingHours").textContent=(total/60).toFixed(1)+"h";
  document.getElementById("weekLabel").textContent=`${start.toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${end.toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;
}
function renderWorkoutList(){
  const dates=Object.keys(workouts).sort();
  document.getElementById("workoutList").innerHTML=dates.map(k=>{
    const d=new Date(k+"T00:00:00");
    const items=workouts[k];
    return `<div class="divider"></div><div style="font-weight:750">${d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</div>`+
      items.map(w=>`<div class="check"><i class="dot ${w.type}"></i><span>${w.name} · ${w.info}</span></div>`).join("");
  }).join("");
}
document.getElementById("settings").onclick=()=>{
  document.getElementById("modalTitle").textContent="App Settings";
  document.getElementById("modalBody").innerHTML="<b>iPhone mode enabled</b><br><br>Pinch zoom is disabled and the layout uses iPhone safe-area spacing. Your calendar is month-by-month with tappable workout days.";
  document.getElementById("modal").classList.add("show");
};

// Prevent iOS pinch/double-tap zoom gestures.
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
