<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juan's Training">
<link rel="manifest" href="manifest.json">
<title>Juan's Training</title>
<style>
:root{--bg:#080d13;--panel:#111a24;--card:#172331;--text:#f4f7fb;--muted:#91a0b2;--blue:#2f8cff;--green:#25c77a;--red:#ff5252;--purple:#a96cff;--orange:#ff9f43;--border:#263544}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center}.title{font-size:25px;font-weight:800}.subtitle{font-size:13px;color:var(--muted);margin-top:3px}
button{font:inherit;color:inherit}.iconbtn{width:44px;height:44px;border:1px solid var(--border);background:var(--panel);border-radius:14px;font-size:24px}.monthbar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px}.month{font-size:20px;font-weight:750}.arrow{width:44px;height:44px;border:1px solid var(--border);background:var(--panel);border-radius:13px;font-size:25px}
.calendar{margin:0 12px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:12px}.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--muted);font-size:11px;margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:66px;background:#0d151e;border:1px solid #1c2a38;border-radius:12px;padding:7px;text-align:left;position:relative}.day.muted{opacity:.28}.day.selected{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.num{font-size:13px;font-weight:700}.dotrow{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}.dot{width:7px;height:7px;border-radius:50%}.run{background:var(--green)}.lift{background:var(--red)}.yoga{background:var(--purple)}.other{background:var(--orange)}.details{margin:14px 12px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:16px}.datehead{font-size:17px;font-weight:750}.hint{font-size:12px;color:var(--muted);margin-top:3px}.workout{margin-top:12px;border:1px solid var(--border);background:var(--card);border-radius:15px;padding:14px;width:100%;text-align:left}.wtop{display:flex;align-items:center;gap:10px}.wname{font-weight:750}.winfo{font-size:13px;color:var(--muted);margin-top:4px}.section{padding:0 12px;margin-top:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:16px}.check{display:flex;gap:10px;align-items:center;margin-top:11px;color:#dbe4ee;font-size:14px}.check input{width:20px;height:20px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(8,13,19,.95);border-top:1px solid var(--border);padding:9px max(12px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.nav{max-width:560px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav button{background:transparent;border:0;padding:8px 4px;color:var(--muted);font-size:12px}.nav button.active{color:var(--blue);font-weight:700}.screen{display:none}.screen.active{display:block}.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:#111a24;border-radius:24px 24px 0 0;width:100%;padding:20px 18px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}.sheet h2{margin:0 0 8px}.primary{background:var(--blue);border:0;border-radius:14px;padding:13px 16px;width:100%;font-weight:750}.small{font-size:12px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div><div class="title">Juan's Training</div><div class="subtitle">Train · Improve · Race · Repeat</div></div>
<button class="iconbtn" id="settings" aria-label="Settings">⚙︎</button>
</header>

<section id="calendarScreen" class="screen active">
<div class="monthbar"><button class="arrow" id="prev">‹</button><div class="month" id="month"></div><button class="arrow" id="next">›</button></div>
<div class="calendar">
<div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
<div class="grid" id="grid"></div>
</div>
<div class="details" id="details"></div>
</section>

<section id="progressScreen" class="screen">
<div class="section"><div class="card"><div style="font-size:20px;font-weight:800">Weekly Progress</div><div class="hint">Your training dashboard</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
<div class="card"><b id="runMiles">0.0</b><div class="hint">Run miles</div></div>
<div class="card"><b id="liftSessions">0</b><div class="hint">Lift sessions</div></div>
<div class="card"><b id="trainingHours">0.0h</b><div class="hint">Training time</div></div>
<div class="card"><b>0</b><div class="hint">Swim sessions</div></div>
</div></div></div>
<div class="section"><div class="card"><b>Current Goals</b><div class="check"><span>🏊</span><span>70.3 Chattanooga</span></div><div class="check"><span>🏃</span><span>Half Marathon</span></div><div class="check"><span>🏋️</span><span>Bench 315</span></div></div></div>
</section>

<section id="workoutsScreen" class="screen">
<div class="section"><div class="card"><div style="font-size:20px;font-weight:800">Workouts</div><div class="hint">Your planned training</div><div id="workoutList"></div></div></div>
</section>

<div class="bottom"><nav class="nav">
<button data-screen="calendarScreen" class="active">▣<br>Calendar</button>
<button data-screen="workoutsScreen">♜<br>Workouts</button>
<button data-screen="progressScreen">▥<br>Progress</button>
</nav></div>
</div>

<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle"></h2><div id="modalBody" class="small"></div><br><button class="primary" id="close">Done</button></div></div>

<script>
const workouts={
"2026-09-23":[["run","Run","4.0 miles · 9:00/mi"]],
"2026-09-24":[["lift","Upper 2 — Back","1 hour"]],
"2026-09-25":[["lift","Lower 2 — Legs","1 hour"]],
"2026-09-27":[["lift","Lower 1 — Legs","1 hour"]],
"2026-09-29":[["run","Run","Planned run"]],
"2026-10-01":[["run","Run","Planned run"]],
"2026-10-02":[["lift","Lower 2 — Legs","1 hour"]],
"2026-10-04":[["lift","Lower 1 — Legs","1 hour"]]
};
let view=new Date(2026,8,23),selected="2026-09-23";
const pad=n=>String(n).padStart(2,"0"),key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function render(){
const y=view.getFullYear(),m=view.getMonth();
document.getElementById("month").textContent=view.toLocaleString("en-US",{month:"long",year:"numeric"});
const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),g=document.getElementById("grid");g.innerHTML="";
for(let i=0;i<42;i++){let d=i-first+1,yy=y,mm=m,muted=false;if(d<1){d=prevDays+d;mm--;muted=true;if(mm<0){mm=11;yy--}}else if(d>days){d-=days;mm++;muted=true;if(mm>11){mm=0;yy++}}
let k=key(yy,mm,d),b=document.createElement("button");b.className="day"+(muted?" muted":"")+(k===selected?" selected":"");b.type="button";b.innerHTML=`<div class="num">${d}</div><div class="dotrow">${(workouts[k]||[]).map(w=>`<i class="dot ${w[0]}"></i>`).join("")}</div>`;b.onclick=()=>{selected=k;render();showDetails()};g.appendChild(b)}
showDetails()
}
function showDetails(){
const p=selected.split("-").map(Number),d=new Date(p[0],p[1]-1,p[2]),items=workouts[selected]||[];
document.getElementById("details").innerHTML=`<div class="datehead">${d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div><div class="hint">${items.length?items.length+" workout"+(items.length>1?"s":"")+" planned":"Recovery / no workout scheduled"}</div>`+
(items.length?items.map((w,i)=>`<button class="workout" type="button" data-i="${i}"><div class="wtop"><i class="dot ${w[0]}" style="width:10px;height:10px"></i><div><div class="wname">${w[1]}</div><div class="winfo">${w[2]}</div></div><span style="margin-left:auto">›</span></div></button>`).join(""):`<div class="small" style="margin-top:14px">No workout is scheduled for this day.</div>`);
document.querySelectorAll(".workout").forEach(b=>b.onclick=()=>openWorkout(items[+b.dataset.i]));
}
function openWorkout(w){document.getElementById("modalTitle").textContent=w[1];document.getElementById("modalBody").innerHTML=`<b>${w[2]}</b><br><br>Workout detail screen is ready for us to customize next — exercises, sets, reps, pace, notes, completion, and more.`;document.getElementById("modal").classList.add("show")}
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
document.getElementById("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(b.dataset.screen).classList.add("active")});
document.getElementById("settings").onclick=()=>{document.getElementById("modalTitle").textContent="Settings";document.getElementById("modalBody").innerHTML="App settings will live here as we build the next versions.";document.getElementById("modal").classList.add("show")};
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
